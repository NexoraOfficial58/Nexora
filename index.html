<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Plateforme IA SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            950: '#052e16',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Navigation -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/20">
                N
            </div>
            <span class="font-bold text-xl tracking-wide text-white">NEXORA</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="authBtn" onclick="toggleAuth()" class="px-4 py-2 rounded-xl text-sm font-medium bg-white/10 hover:bg-white/20 transition text-white">
                Se connecter
            </button>
            <a href="https://buy.stripe.com/aFai4f2UT9JQzhSell19W02" target="_blank" class="px-4 py-2 rounded-xl text-sm font-medium gradient-bg text-white shadow-lg shadow-brand-500/20 hover:opacity-90 transition">
                <i class="fa-solid fa-crown mr-1"></i> Pro (29€)
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full p-6 flex flex-col justify-center relative">
        
        <!-- Console IA (Accessible en mode freemium) -->
        <section id="aiConsole" class="glass p-6 sm:p-10 rounded-3xl border border-white/15 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-72 h-72 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Studio IA & Dashboard Contextuel</h1>
                    <p class="text-slate-400 text-sm">Posez vos questions ou exécutez vos requêtes neuronales en temps réel.</p>
                </div>
                <a href="https://buy.stripe.com/aFai4f2UT9JQzhSell19W02" target="_blank" class="gradient-bg text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-brand-500/30 hover:opacity-90 transition whitespace-nowrap">
                    <i class="fa-solid fa-lock-open mr-1"></i> Débloquer l'offre Pro
                </a>
            </div>

            <!-- Zone de chat / résultats -->
            <div id="outputContainer" class="bg-slate-900/60 rounded-2xl p-4 min-h-[180px] max-h-[350px] overflow-y-auto mb-6 border border-white/5 text-slate-300 text-sm">
                <p class="text-slate-500 italic">Prêt à interagir... Tapez votre prompt ci-dessous.</p>
            </div>

            <!-- Input et Bouton d'envoi -->
            <div class="flex gap-3">
                <input type="text" id="promptInput" placeholder="Écrivez votre prompt ici..." class="flex-grow bg-slate-900/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                <button onclick="generateAIContent()" class="gradient-bg text-white px-6 py-3 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/20 hover:opacity-90 transition flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Envoyer
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-white/5">
        &copy; 2026 NEXORA. Tous droits réservés.
    </footer>

    <!-- Scripts JavaScript -->
    <script>
        function checkUserSession() {
            const user = localStorage.getItem('nexora_user');
            const authBtn = document.getElementById('authBtn');
            if (user) {
                if (authBtn) authBtn.innerText = "Déconnexion";
            } else {
                if (authBtn) authBtn.innerText = "Se connecter";
            }
        }

        function toggleAuth() {
            const user = localStorage.getItem('nexora_user');
            if (user) {
                localStorage.removeItem('nexora_user');
                alert('Déconnecté avec succès.');
            } else {
                localStorage.setItem('nexora_user', 'demo_visitor@nexora.ai');
                alert('Connecté en mode test !');
            }
            location.reload();
        }

        function generateAIContent() {
            const input = document.getElementById('promptInput');
            const output = document.getElementById('outputContainer');
            
            if (!input.value.trim()) return;

            output.innerHTML += `<div class="mb-3 text-white"><strong>Vous :</strong> ${input.value}</div>`;
            const userQuery = input.value;
            input.value = '';

            setTimeout(() => {
                output.innerHTML += `<div class="mb-3 text-brand-400"><strong>Nexora AI :</strong> Traitement de votre requête "${userQuery}" en cours... Connexion aux clusters neuronaux établie avec succès !</div>`;
                output.scrollTop = output.scrollHeight;
            }, 600);
        }

        window.onload = checkUserSession;
    </script>
</body>
</html>
