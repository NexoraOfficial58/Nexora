<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Générateur d'Applications IA</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --accent: #6366f1;
            --cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(11, 15, 25, 0.8); }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-pro { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 20px; font-weight: 600; cursor: pointer; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .hero { text-align: center; margin-bottom: 1.5rem; }
        .settings-bar { width: 100%; max-width: 700px; margin-bottom: 1rem; display: flex; justify-content: flex-end; }
        .settings-bar input { background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 0.5rem; border-radius: 6px; font-size: 0.85rem; width: 250px; outline: none; }
        .prompt-box { width: 100%; max-width: 700px; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; display: flex; gap: 0.5rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .prompt-box input { flex: 1; background: transparent; border: none; color: white; font-size: 1rem; outline: none; }
        .prompt-box button { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .preview-container { width: 100%; margin-top: 2rem; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; height: 500px; display: flex; flex-direction: column; }
        .preview-header { padding: 0.75rem 1.0rem; background-color: #0d121f; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; background-color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); padding: 2rem; border-radius: 12px; text-align: center; max-width: 400px; border: 1px solid var(--accent); }
    </style>
</head>
<body>
    <header>
        <div class="logo">NEXORA</div>
        <button class="btn-pro" onclick="openModal()">Passer à NEXORA Pro (29€/mois)</button>
    </header>
    <main>
        <div class="hero">
            <h1>Que voulez-vous créer aujourd'hui ?</h1>
            <p style="color: var(--text-muted);">Décrivez votre projet et laissez l'IA le coder en direct.</p>
        </div>
        
        <div class="settings-bar">
            <input type="password" id="apiKeyInput" placeholder="Entrez votre clé API OpenAI (sk-...)">
        </div>

        <div class="prompt-box">
            <input type="text" id="promptInput" placeholder="Ex: Crée un tableau de bord financier avec des graphiques...">
            <button onclick="generateApp()">Générer ✨</button>
        </div>

        <div class="preview-container">
            <div class="preview-header">
                <span>Aperçu en direct</span>
                <button onclick="openModal()" style="background: transparent; color: var(--cyan); border: 1px solid var(--cyan); padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer;">Exporter 🔒</button>
            </div>
            <iframe id="previewFrame"></iframe>
        </div>
    </main>

    <div class="modal" id="payModal">
        <div class="modal-content">
            <h2>NEXORA Pro</h2>
            <p style="margin: 1rem 0; color: var(--text-muted);">Débloquez l'exportation et l'hébergement cloud illimité.</p>
            <button onclick="alert('Redirection vers Stripe...')" style="background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">S'abonner (29€/mois)</button>
            <button onclick="closeModal()" style="background: transparent; color: white; border: none; margin-top: 1rem; cursor: pointer;">Fermer</button>
        </div>
    </div>

    <script>
        const previewFrame = document.getElementById('previewFrame');

        async function generateApp() {
            const promptText = document.getElementById('promptInput').value;
            const apiKey = document.getElementById('apiKeyInput').value;

            if (!promptText) {
                alert('Veuillez entrer une description de projet.');
                return;
            }

            if (!apiKey) {
                previewFrame.srcdoc = `
                    <div style="font-family:sans-serif; text-align:center; padding:3rem;">
                        <h2 style="color:#6366f1;">Projet : ${promptText}</h2>
                        <p style="color:#666; margin-top:10px;">Mode démo actif (ajoutez votre clé API OpenAI en haut pour une vraie génération par IA).</p>
                    </div>
                `;
                return;
            }

            previewFrame.srcdoc = "<h3 style='font-family:sans-serif; text-align:center; margin-top:20%; color:#6366f1;'>✨ Connexion à l'IA en cours...</h3>";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [{
                            role: "system",
                            content: "Tu es un expert en dev web. Renvoie UNIQUEMENT du code HTML, CSS et JS complet et fonctionnel basé sur la demande, sans markdown autour si possible, ou nettoie-le."
                        }, {
                            role: "user",
                            content: promptText
                        }]
                    })
                });

                const data = await response.json();
                if(data.error) {
                    previewFrame.srcdoc = `<h3 style='color:red; text-align:center; margin-top:20%;'>Erreur API : ${data.error.message}</h3>`;
                    return;
                }

                let code = data.choices[0].message.content;
                code = code.replace(/```html/g, '').replace(/```/g, '');
                previewFrame.srcdoc = code;

            } catch (err) {
                previewFrame.srcdoc = "<h3 style='color:red; text-align:center; margin-top:20%;'>Erreur de connexion réseau.</h3>";
            }
function subscribePro() {
    window.location.href = 'https://buy.stripe.com/test_eVaf29brncsX1j3ePF1KA00';
}
   
}
        function openModal() { document.getElementById('payModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('payModal').style.display = 'none'; }
    </script>
</body>
</html>
