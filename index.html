<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA.AI – Créez votre logiciel avec l'IA</title>
<style>
:root {
  --bg:#070b18;
  --panel:#10182c;
  --blue:#3987ff;
  --purple:#8657ff;
  --text:#f5f7ff;
  --muted:#a5b1ca;
  --border:rgba(255,255,255,.10);
}
* {box-sizing:border-box;margin:0;padding:0}
html {scroll-behavior:smooth}
body {font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
a {text-decoration:none;color:inherit}
.container {width:min(1120px,92%);margin:auto;}
header {position:sticky;top:0;z-index:100;background:rgba(7,11,24,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
.nav {min-height:76px;display:flex;align-items:center;justify-content:space-between;}
.logo {font-size:25px;font-weight:900;letter-spacing:1px;}
.logo span {background:linear-gradient(90deg,#48a1ff,#a77aff);-webkit-background-clip:text;color:transparent;}
.btn {display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border:0;border-radius:12px;color:white;font-weight:800;cursor:pointer;background:linear-gradient(110deg,var(--blue),var(--purple));box-shadow:0 8px 30px rgba(75,120,255,.25);transition:.25s;}
.btn:hover {transform:translateY(-3px);filter:brightness(1.15);}
.hero {padding:80px 0 50px;text-align:center;}
h1 {font-size:clamp(36px,6vw,60px);font-weight:900;line-height:1.1;margin-bottom:20px;}
.gradient {background:linear-gradient(90deg,#4ca5ff,#9d72ff);-webkit-background-clip:text;color:transparent;}
.builder {background:linear-gradient(145deg,#111c35,#0c1225);border:1px solid rgba(87,133,255,.28);padding:35px;border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.4);margin-top:40px;text-align:left;position:relative;}
.builder input[type="text"] {width:100%;padding:18px;border-radius:12px;border:1px solid var(--border);background:#080e1d;color:white;outline:none;margin-bottom:15px;font-size:16px;}
.examples {display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px;}
.example {padding:8px 14px;border-radius:8px;background:#1c2945;color:#b9caff;border:1px solid var(--border);cursor:pointer;font-size:13px;}

/* POP-UPS DE SPECTACLE DE CODE */
.popup-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(3, 5, 12, 0.92);
  backdrop-filter: blur(12px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
}
.popup-card {
  position: absolute;
  width: min(650px, 92%);
  background: #091124;
  border: 1px solid rgba(74, 165, 255, 0.5);
  border-radius: 16px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(57, 135, 255, 0.2);
  overflow: hidden;
  display: none;
  animation: popIn 0.4s ease-out forwards;
}
@keyframes popIn {
  from { opacity:0; transform: scale(0.85) translateY(40px); }
  to { opacity:1; transform: scale(1) translateY(0); }
}
.popup-topbar {
  background: #050a16;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.popup-dots { display: flex; gap: 6px; }
.popup-dot { width: 11px; height: 11px; border-radius: 50%; }
.dot-r { background: #ff5f56; }
.dot-y { background: #ffbd2e; }
.dot-g { background: #27c93f; }
.popup-content {
  padding: 22px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
  color: #7dd3fc;
  line-height: 1.6;
}
.code-stream {
  background: #030712;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 15px;
  margin-top: 12px;
  height: 160px;
  overflow-y: hidden;
  color: #4ade80;
  font-size: 12px;
  white-space: pre-wrap;
}
.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin-top: 15px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3987ff, #8657ff);
  transition: width 0.1s linear;
}

/* ZONE APERÇU ET SIMULATEUR */
#preview {
  display:none;
  margin-top:25px;
  background:#080e1d;
  padding:25px;
  border:1px solid rgba(92,143,255,.4);
  border-radius:18px;
  position: relative;
}
.simulator-box {
  background:#0d162d;
  border:1px solid rgba(86,135,255,0.3);
  border-radius:16px;
  padding:25px;
  margin-top:25px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.sim-section-title {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 10px;
}
.option-card {
  background: #131f3b;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  color: #f5f7ff;
  transition: all 0.2s ease;
}
.option-card:hover {
  border-color: rgba(57,135,255,0.5);
  background: #19294d;
}
.option-card.active {
  background: linear-gradient(110deg, var(--blue), var(--purple));
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(57,135,255,0.3);
  color: #fff;
}

/* LA MODALE DE RÉVÉLATION ULTRA MOTIVANTE */
.reveal-modal-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(7, 11, 24, 0.96);
  backdrop-filter: blur(12px);
  z-index: 50;
  display: none;
